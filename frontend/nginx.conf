server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;

  # El DNS interno de Docker cambia la IP del backend cada vez que se recrea el contenedor. Con el nombre en una
  # variable y un `resolver`, nginx lo vuelve a resolver en lugar de quedarse con la IP del arranque (daba 502).
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (logs de jobs): sin buffer y con timeout largo.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
