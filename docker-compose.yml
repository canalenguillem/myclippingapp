services:
  mariadb:
    image: mariadb:11.4
    container_name: clip_mariadb
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: clippingvideos-app
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clip_backend
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8800:8000"
    volumes:
      - ./media:/media
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5"
    restart: unless-stopped

  worker:
    image: clippingvideos-app
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clip_worker
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./media:/media
      - ./backend/assets:/app/assets:ro
    command: python -m app.worker
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: clip_frontend
    depends_on:
      - backend
    ports:
      - "5074:80"
    restart: unless-stopped

volumes:
  db_data:
